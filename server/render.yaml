# The control plane keeps its implant registry in SQLite at
# server/data/forzer.db (FORZER_DB overrides the path). Each row holds an
# implant's shared secret, so this file is a credential store: anyone who reads
# it can impersonate every enrolled device to this control plane.
#
# WARNING: `plan: free` has an EPHEMERAL filesystem. Every redeploy, restart or
# sleep-then-wake wipes that file, which forgets every enrolled implant. You
# will see agents fail authentication and re-enrol as brand new implants.
#
# Fix this before relying on any of it in anger - any one of:
#   - move to a paid plan and attach a disk mounted at
#     /opt/render/project/src/server/data
#   - point FORZER_DB at a path backed by a real volume
#   - run the control plane somewhere with a persistent filesystem
# Until then, treat the identity work as local/dev-only.
#
# DASH_USER and DASH_PASS are declared below with sync: false, so Render will
# refuse to deploy until you set them. They were previously absent entirely,
# which silently ran the dashboard on placeholders published in this repository.
#
# NODE_VERSION is pinned deliberately. The control plane stores its implant
# registry with node:sqlite, which is still flagged experimental in 22.x, and
# `runtime: node` alone resolves to whatever is newest at deploy time — so a
# Node release that moves that API breaks the registry on a deploy nobody
# touched. Bump this line on purpose, not by surprise.
services:
  - type: web
    name: forzer-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: PORT
        value: 3000
      - key: SETUP_KEY
        sync: false
        generateValue: true
      - key: DASH_USER
        sync: false
      - key: DASH_PASS
        sync: false
      # Uncomment once a persistent disk is attached.
      # - key: FORZER_DB
      #   value: /opt/render/project/src/server/data/forzer.db
